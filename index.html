<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サンプルページ</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f8;
      color: #333;
    }
    header {
      background-color: #4a90e2;
      color: white;
      padding: 20px;
      text-align: center;
    }
    main {
      max-width: 900px;
      margin: 24px auto;
      padding: 0 16px;
    }
    section {
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      margin-bottom: 16px;
      padding: 20px;
    }
    h1, h2 {
      margin: 0 0 12px 0;
    }
    p {
      line-height: 1.7;
      margin: 0 0 12px 0;
    }
    footer {
      text-align: center;
      padding: 16px;
      font-size: 0.9rem;
      color: #666;
    }
  </style>
</head>
<body>
  <header>
    <h1>サンプルページへようこそ</h1>
    <p>これは簡単なHTMLのサンプルページです。</p>
  </header>
  <main>
    <section>
      <h2>概要</h2>
      <p>このページは、HTMLの基本構造を示すためのサンプルです。ヘッダー、本文、フッターを含んでいます。</p>
    </section>
    <section>
      <h2>使い方</h2>
      <p>このファイルをブラウザーで開くと、シンプルなページレイアウトが表示されます。必要に応じて内容やスタイルを変更してください。</p>
    </section>
  </main>
  <footer>
    <p>© 2026 サンプルページ</p>
  </footer>
</body>
</html>
